<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alias — AI Campaign Brief Assistant</title>
  <link rel="stylesheet" href="css/style.css?v=27">
  <link rel="stylesheet" href="css/layout.css?v=27">
  <link rel="stylesheet" href="css/components.css?v=27">
  <link rel="stylesheet" href="css/chat.css?v=27">
  <link rel="stylesheet" href="css/dashboard.css?v=27">
</head>
<body>
  <div class="app-wrapper">
    <!-- Top Navigation -->
    <header class="app-nav">
      <div class="nav-brand-section">
        <a href="index.html" class="brand-logo">
          <div class="brand-icon">A</div>
          <span>ALIAS</span>
        </a>
        <span class="module-badge">Agent 1 — Campaign Intake</span>
      </div>

      <!-- View Switcher -->
      <nav class="nav-view-switcher" aria-label="Interface Views">
        <a href="index.html" class="nav-switch-btn active" title="Customer Experience">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          Customer View
        </a>
        <a href="operator.html" class="nav-switch-btn" id="nav-link-operator" title="Human Operator Dashboard">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/><path d="m14 9 3 3-3 3"/></svg>
          Operator Dashboard
        </a>
      </nav>

      <div class="nav-actions-section">
        <div class="sync-status-indicator" title="Connected via Local Sync">
          <span class="sync-pulse"></span>
          <span>Live Sync</span>
        </div>
        <button class="btn btn-ghost btn-sm" id="btn-reset-demo" title="Reset all mock data">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
          Reset Demo
        </button>
      </div>
    </header>

    <!-- Customer Experience Center Frame (Single-Column Conversational Intake) -->
    <main class="customer-layout">
      <!-- Active Customer Conversation Frame -->
      <div class="customer-card-frame">
        <!-- Chat Header -->
        <div class="chat-header">
          <div class="chat-header-info">
            <div class="avatar avatar-customer" id="customer-avatar" style="font-weight:700;">
              TA
            </div>
            <div>
              <div style="display:flex; align-items:center; gap:0.5rem; flex-wrap:wrap;">
                <span class="chat-header-title" id="chat-header-business">Lumina Skincare Campaign Intake</span>
              </div>
              <div class="chat-header-status" id="header-status">
                <span class="badge-dot ai"></span>
                <span>Alias AI Assistant Connected</span>
              </div>
            </div>
          </div>
          <div style="display:flex; align-items:center; gap:0.625rem;">
            <!-- Review Final Brief button: Activates ONLY once intake is finished! -->
            <button class="btn btn-primary btn-sm" id="btn-review-final-brief" style="display:none;" title="Review and confirm your completed campaign brief">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><polyline points="20 6 9 17 4 12"/></svg>
              Review Final Brief
            </button>
          </div>
        </div>

        <!-- Chat Timeline -->
        <div class="chat-messages" id="chat-messages" role="log" aria-live="polite">
          <!-- Messages will be rendered here dynamically -->
        </div>

        <!-- Typing Indicator (Messenger 3-Dot Animated Bubble) -->
        <div id="typing-indicator" class="typing-indicator-row" style="display:none;" aria-label="Typing">
          <div class="avatar avatar-human" id="customer-typing-avatar" style="width:28px; height:28px; font-size:11px; margin-right:8px; flex-shrink:0;">SK</div>
          <div class="typing-bubble">
            <span class="typing-dot"></span>
            <span class="typing-dot"></span>
            <span class="typing-dot"></span>
          </div>
        </div>

        <!-- Chat Composer -->
        <div class="chat-composer">
          <!-- Attachment Preview Bar -->
          <div id="attachment-preview-container" class="attachment-preview-bar"></div>

          <div class="composer-controls">
            <!-- Hidden native file input -->
            <input type="file" id="chat-file-input" style="display:none;" multiple accept=".pdf,.doc,.docx,.png,.jpg,.jpeg,.webp">
            <button class="btn-icon" id="btn-attach" title="Attach Brand Assets, Guidelines or Documents">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
            </button>
            <textarea
              class="composer-input"
              id="chat-input"
              rows="1"
              placeholder="Type your response or answer naturally (e.g. 'We make organic serums for women aged 20–35')..."
              aria-label="Campaign message"
            ></textarea>
            <button class="btn btn-primary" id="btn-send" title="Send message">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
              <span>Send</span>
            </button>
          </div>
        </div>
      </div>
    </main>

    <!-- Collapsible Live Campaign Brief Side Drawer -->
    <aside class="brief-drawer" id="brief-drawer" aria-label="Campaign brief inspector">
      <div class="drawer-header">
        <div>
          <h2 style="font-size:15px; font-weight:700; color:var(--color-navy);" id="drawer-main-title">Answers Collected So Far</h2>
          <div style="font-size:12px; color:var(--color-text-muted);" id="overall-progress-text">0% Complete</div>
        </div>
        <button class="btn-icon" id="btn-close-drawer" title="Close drawer">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>

      <!-- Overall Progress Bar -->
      <div style="padding: 0.75rem 1.25rem 0.25rem 1.25rem;">
        <div class="progress-track">
          <div class="progress-fill" id="overall-progress-bar" style="width: 0%;"></div>
        </div>
      </div>

      <!-- Drawer Content -->
      <div class="drawer-body" id="drawer-body">
        <!-- Rendered dynamically -->
      </div>
    </aside>

    <!-- Toast Notification Container -->
    <div class="toast-container" id="toast-container"></div>
  </div>

  <!-- JavaScript Modules -->
  <script src="js/state.js?v=27"></script>
  <script src="js/campaign.js?v=27"></script>
  <script src="js/mockAI.js?v=27"></script>
  <script src="js/handoff.js?v=27"></script>
  <script src="js/aiControl.js?v=27"></script>
  <script src="js/chat.js?v=27"></script>
  <script src="js/app.js?v=27"></script>
</body>
</html>
